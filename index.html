<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Polymarket Paper Dashboard</title>
<script src="vendor/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1419;
    --panel: #1a2332;
    --border: #2a3544;
    --text: #e7ecf3;
    --muted: #8b9bb4;
    --green: #3dd68c;
    --red: #f07178;
    --amber: #e6b450;
    --blue: #59c2ff;
    --accent: #7aa2f7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.45;
  }
  header {
    padding: 16px 20px; border-bottom: 1px solid var(--border);
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
    position: sticky; top: 0; background: rgba(15,20,25,0.95); backdrop-filter: blur(8px); z-index: 20;
  }
  h1 { font-size: 18px; margin: 0; font-weight: 600; }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600;
    background: #243044; color: var(--amber); border: 1px solid var(--border);
  }
  .badge.pause { color: var(--red); }
  .badge.live { color: var(--green); }
  .meta { color: var(--muted); font-size: 12px; }
  .controls {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  }
  select, input[type="search"] {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 10px; font-size: 13px;
  }
  input[type="search"] { min-width: 180px; }
  main { padding: 16px 20px 40px; max-width: 1400px; margin: 0 auto; }
  .summary {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 16px;
  }
  .stat {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px;
  }
  .stat .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .stat .v { font-size: 20px; font-weight: 650; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .pos { color: var(--green); }
  .neg { color: var(--red); }
  table.books {
    width: 100%; border-collapse: collapse; background: var(--panel);
    border: 1px solid var(--border); border-radius: 10px; overflow: hidden; font-size: 13px;
  }
  table.books th, table.books td {
    padding: 9px 10px; text-align: right; border-bottom: 1px solid var(--border);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  table.books th { text-align: right; color: var(--muted); font-weight: 600; font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.03em; cursor: pointer; user-select: none; background: #152032; }
  table.books th.name, table.books td.name { text-align: left; }
  table.books tr:hover td { background: #1e2a3d; }
  table.books tr.active td { background: #243044; }
  table.books th.sort-asc::after { content: " ▲"; font-size: 9px; }
  table.books th.sort-desc::after { content: " ▼"; font-size: 9px; }
  .cards {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; margin-top: 18px;
  }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px;
  }
  .card h3 { margin: 0 0 6px; font-size: 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .card .row { display: flex; flex-wrap: wrap; gap: 10px 14px; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .card .row strong { color: var(--text); font-weight: 600; }
  .chart-wrap { position: relative; height: 160px; }
  .chart-wrap.large { height: 280px; }
  footer { color: var(--muted); font-size: 11px; padding: 20px; text-align: center; }
  a { color: var(--blue); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Polymarket Paper Dashboard <span class="badge">PAPER ONLY</span></h1>
    <div class="meta" id="genMeta">Loading…</div>
  </div>
  <div class="controls">
    <label class="meta">Window
      <select id="windowSel">
        <option value="1d">1 Day</option>
        <option value="7d">1 Week</option>
        <option value="30d">1 Month</option>
        <option value="all" selected>All time</option>
      </select>
    </label>
    <label class="meta">Sort
      <select id="sortSel">
        <option value="total_pnl">Profit</option>
        <option value="equity">Equity</option>
        <option value="max_dd">Drawdown</option>
        <option value="wr">Win rate</option>
        <option value="n_settled">Settled</option>
        <option value="label">Name</option>
      </select>
    </label>
    <label class="meta">Order
      <select id="orderSel">
        <option value="desc">Desc</option>
        <option value="asc">Asc</option>
      </select>
    </label>
    <input type="search" id="searchBox" placeholder="Filter strategies…"/>
  </div>
</header>
<main>
  <div class="summary" id="summary"></div>
  <div style="overflow-x:auto">
    <table class="books" id="booksTable">
      <thead>
        <tr>
          <th class="name" data-sort="label">Strategy</th>
          <th data-sort="equity">Equity</th>
          <th data-sort="total_pnl">Profit</th>
          <th data-sort="window_pnl">Δ window</th>
          <th data-sort="realized_pnl">Realized</th>
          <th data-sort="max_dd">Max DD</th>
          <th data-sort="max_dd_pct">DD %</th>
          <th data-sort="wr">WR</th>
          <th data-sort="n_open">Open</th>
          <th data-sort="n_settled">Settled</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="booksBody"></tbody>
    </table>
  </div>
  <div class="cards" id="cards"></div>
</main>
<footer>
  Local file · Phase 1 paper · Refresh: <code>.venv/bin/python bin/build_dashboard.py</code> or <code>bin/dashboard_refresh.sh</code>
</footer>

const charts = {};
let currentWindow = "all";
let sortKey = "total_pnl";
let sortOrder = "desc";
let search = "";

function fmtMoney(n) {
  if (n == null || Number.isNaN(n)) return "—";
  const sign = n > 0 ? "+" : "";
  return sign + "$" + n.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
}
function fmtPct(n) {
  if (n == null || Number.isNaN(n)) return "—";
  return n.toFixed(1) + "%";
}
function cls(n) { return n > 0 ? "pos" : (n < 0 ? "neg" : ""); }

function filteredBooks() {
  let books = DATA.books.filter(b => !b.empty);
  if (search) {
    const q = search.toLowerCase();
    books = books.filter(b => b.label.toLowerCase().includes(q) || b.id.toLowerCase().includes(q));
  }
  books = books.slice().sort((a, b) => {
    const ma = a.metrics[currentWindow] || {};
    const mb = b.metrics[currentWindow] || {};
    let va, vb;
    if (sortKey === "label") { va = a.label; vb = b.label; }
    else { va = ma[sortKey]; vb = mb[sortKey]; }
    if (va == null) va = sortOrder === "asc" ? Infinity : -Infinity;
    if (vb == null) vb = sortOrder === "asc" ? Infinity : -Infinity;
    if (typeof va === "string") {
      return sortOrder === "asc" ? va.localeCompare(vb) : vb.localeCompare(va);
    }
    return sortOrder === "asc" ? (va - vb) : (vb - va);
  });
  return books;
}

function renderSummary(books) {
  const el = document.getElementById("summary");
  let sumEq = 0, sumPnl = 0, sumDd = 0, nPaused = 0, nLive = 0;
  for (const b of books) {
    const m = b.metrics[currentWindow];
    if (!m) continue;
    sumEq += m.equity || 0;
    sumPnl += m.total_pnl || 0;
    sumDd += m.max_dd || 0;
    if (b.paused) nPaused++; else nLive++;
  }
  el.innerHTML = `
    <div class="stat"><div class="k">Strategies</div><div class="v">${books.length}</div></div>
    <div class="stat"><div class="k">Σ Equity</div><div class="v">${fmtMoney(sumEq).replace("+","")}</div></div>
    <div class="stat"><div class="k">Σ Profit (${currentWindow})</div><div class="v ${cls(sumPnl)}">${fmtMoney(sumPnl)}</div></div>
    <div class="stat"><div class="k">Σ Max DD</div><div class="v neg">${fmtMoney(-sumDd).replace("+","−").replace("$-","−$")}</div></div>
    <div class="stat"><div class="k">Live / Paused</div><div class="v">${nLive} / ${nPaused}</div></div>
  `;
}

function statusBadge(b) {
  if (b.paused) return '<span class="badge pause">paused</span>';
  if (b.new_entries === false) return '<span class="badge pause">no new</span>';
  return '<span class="badge live">entries on</span>';
}

function renderTable(books) {
  const body = document.getElementById("booksBody");
  body.innerHTML = books.map(b => {
    const m = b.metrics[currentWindow];
    return `<tr data-id="${b.id}">
      <td class="name">${b.label}</td>
      <td>${fmtMoney(m.equity).replace("+","")}</td>
      <td class="${cls(m.total_pnl)}">${fmtMoney(m.total_pnl)}</td>
      <td class="${cls(m.window_pnl)}">${fmtMoney(m.window_pnl)}</td>
      <td class="${cls(m.realized_pnl)}">${fmtMoney(m.realized_pnl)}</td>
      <td class="neg">−$${Math.abs(m.max_dd).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</td>
      <td class="neg">${fmtPct(m.max_dd_pct)}</td>
      <td>${m.wr != null ? fmtPct(m.wr) : "—"}</td>
      <td>${m.n_open ?? "—"}</td>
      <td>${m.n_settled ?? "—"}</td>
      <td>${statusBadge(b)}</td>
    </tr>`;
  }).join("");
  // header sort indicators
  document.querySelectorAll("table.books th").forEach(th => {
    th.classList.remove("sort-asc", "sort-desc");
    if (th.dataset.sort === sortKey) th.classList.add(sortOrder === "asc" ? "sort-asc" : "sort-desc");
  });
}

function destroyCharts() {
  Object.keys(charts).forEach(k => { charts[k].destroy(); delete charts[k]; });
}

function chartColor(pnl) {
  return pnl >= 0 ? "rgba(61,214,140,0.9)" : "rgba(240,113,120,0.9)";
}

function renderCards(books) {
  destroyCharts();
  const el = document.getElementById("cards");
  el.innerHTML = books.map(b => {
    const m = b.metrics[currentWindow];
    return `<div class="card" id="card-${b.id}">
      <h3>${b.label} ${statusBadge(b)}</h3>
      <div class="row">
        <span>Equity <strong>${fmtMoney(m.equity).replace("+","")}</strong></span>
        <span>Profit <strong class="${cls(m.total_pnl)}">${fmtMoney(m.total_pnl)}</strong></span>
        <span>Δwin <strong class="${cls(m.window_pnl)}">${fmtMoney(m.window_pnl)}</strong></span>
        <span>DD <strong class="neg">−$${Math.abs(m.max_dd).toFixed(2)}</strong> (${fmtPct(m.max_dd_pct)})</span>
        <span>WR <strong>${m.wr != null ? fmtPct(m.wr) : "—"}</strong></span>
        <span>Open/Settled <strong>${m.n_open ?? 0}/${m.n_settled ?? 0}</strong></span>
        <span>Bankroll <strong>$${b.bankroll.toLocaleString()}</strong></span>
      </div>
      <div class="chart-wrap"><canvas id="chart-${b.id}"></canvas></div>
    </div>`;
  }).join("");

  function windowCutoffMs() {
    if (currentWindow === "1d") return Date.now() - 86400000;
    if (currentWindow === "7d") return Date.now() - 7*86400000;
    if (currentWindow === "30d") return Date.now() - 30*86400000;
    return null;
  }
  const cutoff = windowCutoffMs();

  for (const b of books) {
    const m = b.metrics[currentWindow];
    let pts = b.series || [];
    if (cutoff != null) {
      const filtered = pts.filter(p => new Date(p.t).getTime() >= cutoff);
      pts = filtered.length ? filtered : pts.slice(-1);
    }
    const labels = pts.map(p => {
      const d = new Date(p.t);
      return d.toLocaleString("en-HK", {timeZone: "Asia/Hong_Kong", month:"short", day:"numeric", hour:"2-digit", minute:"2-digit"});
    });
    const data = pts.map(p => p.e);
    const ctx = document.getElementById("chart-" + b.id);
    charts[b.id] = new Chart(ctx, {
      type: "line",
      data: {
        labels,
        datasets: [{
          label: "Equity",
          data,
          borderColor: chartColor(m.window_pnl),
          backgroundColor: chartColor(m.window_pnl).replace("0.9", "0.12"),
          borderWidth: 1.5,
          pointRadius: 0,
          fill: true,
          tension: 0.15,
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: (c) => " $" + Number(c.parsed.y).toFixed(2)
            }
          }
        },
        scales: {
          x: {
            ticks: { maxTicksLimit: 6, color: "#8b9bb4", font: { size: 10 } },
            grid: { color: "rgba(42,53,68,0.5)" }
          },
          y: {
            ticks: {
              color: "#8b9bb4", font: { size: 10 },
              callback: (v) => "$" + Number(v).toLocaleString()
            },
            grid: { color: "rgba(42,53,68,0.5)" }
          }
        }
      }
    });
  }
}

function render() {
  document.getElementById("genMeta").textContent =
    `Generated ${DATA.generated_hkt} · ${DATA.n_books} books · window=${currentWindow} · local only`;
  const books = filteredBooks();
  renderSummary(books);
  renderTable(books);
  renderCards(books);
}

document.getElementById("windowSel").addEventListener("change", e => {
  currentWindow = e.target.value; render();
});
document.getElementById("sortSel").addEventListener("change", e => {
  sortKey = e.target.value; render();
});
document.getElementById("orderSel").addEventListener("change", e => {
  sortOrder = e.target.value; render();
});
document.getElementById("searchBox").addEventListener("input", e => {
  search = e.target.value.trim(); render();
});
document.querySelectorAll("table.books th[data-sort]").forEach(th => {
  th.addEventListener("click", () => {
    const k = th.dataset.sort;
    if (sortKey === k) sortOrder = sortOrder === "asc" ? "desc" : "asc";
    else { sortKey = k; sortOrder = k === "label" ? "asc" : "desc"; }
    document.getElementById("sortSel").value = sortKey;
    document.getElementById("orderSel").value = sortOrder;
    render();
  });
});

render();
</script>
</body>
</html>
